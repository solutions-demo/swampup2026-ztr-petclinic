name: Build and Push (SwampUp 2026 ZTR demo)

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compute short SHA
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Write Maven settings.xml mirroring everything through maven-selfheal-virtual
        run: |
          mkdir -p /tmp/m2
          cat > /tmp/m2/settings.xml <<SETTINGSEOF
          <settings>
            <servers>
              <server>
                <id>artifactory-release</id>
                <username>su26-ztr-ci-bot</username>
                <password>${{ secrets.JFROG_ACCESS_TOKEN }}</password>
              </server>
            </servers>
            <mirrors>
              <mirror>
                <id>artifactory-release</id>
                <url>https://${{ secrets.JFROG_URL }}/artifactory/maven-selfheal-virtual</url>
                <mirrorOf>*</mirrorOf>
              </mirror>
            </mirrors>
          </settings>
          SETTINGSEOF

      - name: Build with Maven, resolving through maven-selfheal-virtual
        run: mvn -s /tmp/m2/settings.xml -B -DskipTests package

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to solenglatest
        run: echo "${{ secrets.JFROG_ACCESS_TOKEN }}" | docker login "${{ secrets.JFROG_URL }}" -u su26-ztr-ci-bot --password-stdin

      - name: Build and push vulnerable image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.JFROG_URL }}/base-image-remediation-demo/petclinic:vulnerable-${{ steps.vars.outputs.sha_short }}
            ${{ secrets.JFROG_URL }}/base-image-remediation-demo/petclinic:vulnerable-latest
