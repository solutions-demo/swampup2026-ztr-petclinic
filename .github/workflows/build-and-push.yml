name: Build and Push (SwampUp 2026 ZTR demo)

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compute short SHA
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up JFrog CLI
        uses: jfrog/setup-jfrog-cli@v4
        env:
          JF_URL: https://${{ secrets.JFROG_URL }}
          JF_ACCESS_TOKEN: ${{ secrets.JFROG_ACCESS_TOKEN }}
        with:
          version: latest
          custom-server-id: solenglatest

      - name: Configure Maven resolution/deployment through maven-selfheal-virtual
        run: |
          jf mvn-config \
            --server-id-resolve=solenglatest --server-id-deploy=solenglatest \
            --repo-resolve-releases=maven-selfheal-virtual --repo-resolve-snapshots=maven-selfheal-virtual \
            --repo-deploy-releases=maven-selfheal-virtual --repo-deploy-snapshots=maven-selfheal-virtual

      - name: Build with jf mvn, resolving through maven-selfheal-virtual
        run: jf mvn -B -DskipTests package

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to solenglatest
        run: echo "${{ secrets.JFROG_ACCESS_TOKEN }}" | docker login "${{ secrets.JFROG_URL }}" -u su26-ztr-ci-bot --password-stdin

      - name: Build and push vulnerable image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.JFROG_URL }}/base-image-remediation-demo/petclinic:vulnerable-${{ steps.vars.outputs.sha_short }}
            ${{ secrets.JFROG_URL }}/base-image-remediation-demo/petclinic:vulnerable-latest
