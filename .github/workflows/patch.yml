name: Patch and Push (SwampUp 2026 ZTR demo - remediation)

# Note: no "Remediation Automation" / auto-PR REST API was discoverable on
# this instance (undocumented in the jfrog skill's references, no matching
# endpoint found), so this workflow scripts the version bump itself rather
# than relying on a native platform automation. The remediation is still
# real: the compliant log4j-core build genuinely only exists in
# chainguard-java, resolved through the same ZTR-enabled maven-selfheal-virtual
# repo used for the vulnerable build - nothing here is source-patched by hand.

on:
  workflow_dispatch: {}

jobs:
  patch-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compute short SHA
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up JFrog CLI
        uses: jfrog/setup-jfrog-cli@v4
        env:
          JF_URL: https://${{ secrets.JFROG_URL }}
          JF_ACCESS_TOKEN: ${{ secrets.JFROG_ACCESS_TOKEN }}
        with:
          version: latest
          custom-server-id: solenglatest

      - name: Bump log4j-core to chainguard-java's compliant version
        run: |
          COMPLIANT_VERSION=$(curl -fsSL -H "Authorization: Bearer ${{ secrets.JFROG_ACCESS_TOKEN }}" \
            "https://${{ secrets.JFROG_URL }}/artifactory/chainguard-java/org/apache/logging/log4j/log4j-core/maven-metadata.xml" \
            | grep -oE '<release>[^<]+</release>' | sed -E 's#</?release>##g')
          if [ -z "$COMPLIANT_VERSION" ]; then
            echo "Could not determine compliant version from chainguard-java" >&2
            exit 1
          fi
          echo "Compliant version from chainguard-java: $COMPLIANT_VERSION"
          python3 - "$COMPLIANT_VERSION" <<'PYEOF'
          import re, sys
          version = sys.argv[1]
          with open("pom.xml") as f:
              content = f.read()
          pattern = re.compile(
              r"(<groupId>org\.apache\.logging\.log4j</groupId>\s*"
              r"<artifactId>log4j-core</artifactId>\s*<version>)[^<]+(</version>)"
          )
          new_content, n = pattern.subn(rf"\g<1>{version}\g<2>", content)
          assert n == 1, f"expected exactly 1 match, got {n}"
          with open("pom.xml", "w") as f:
              f.write(new_content)
          print(f"pom.xml log4j-core version set to {version}")
          PYEOF

      - name: Configure Maven resolution/deployment through maven-selfheal-virtual
        run: |
          jf mvn-config \
            --server-id-resolve=solenglatest --server-id-deploy=solenglatest \
            --repo-resolve-releases=maven-selfheal-virtual --repo-resolve-snapshots=maven-selfheal-virtual \
            --repo-deploy-releases=maven-selfheal-virtual --repo-deploy-snapshots=maven-selfheal-virtual

      - name: Build patched jar with jf mvn, resolving through maven-selfheal-virtual
        run: jf mvn -B -DskipTests package

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to solenglatest
        run: echo "${{ secrets.JFROG_ACCESS_TOKEN }}" | docker login "${{ secrets.JFROG_URL }}" -u su26-ztr-ci-bot --password-stdin

      - name: Build and push patched image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.JFROG_URL }}/base-image-remediation-demo/petclinic:patched-${{ steps.vars.outputs.sha_short }}
            ${{ secrets.JFROG_URL }}/base-image-remediation-demo/petclinic:patched-latest
