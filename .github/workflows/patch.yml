name: Patch and Push (SwampUp 2026 ZTR demo - remediation)

on:
  workflow_dispatch: {}

jobs:
  patch-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compute short SHA
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Remove the deliberately-vulnerable SnakeYAML pin (CVE-2022-1471)
        run: |
          python3 - <<'PYEOF'
          import re
          with open("pom.xml") as f:
              content = f.read()
          pattern = re.compile(
              r"\s*<!--\n\s*SwampUp 2026 ZTR demo:.*?-->\n\s*<dependency>\s*"
              r"<groupId>org\.yaml</groupId>\s*<artifactId>snakeyaml</artifactId>\s*"
              r"<version>1\.30</version>\s*</dependency>\n",
              re.DOTALL,
          )
          new_content, n = pattern.subn("\n", content)
          assert n == 1, f"expected exactly 1 match, got {n}"
          with open("pom.xml", "w") as f:
              f.write(new_content)
          PYEOF
          echo "Removed vulnerable SnakeYAML override - build now falls back to Spring Boot's managed, compliant version."

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to solenglatest
        run: echo "${{ secrets.JFROG_ACCESS_TOKEN }}" | docker login "${{ secrets.JFROG_URL }}" -u su26-ztr-ci-bot --password-stdin

      - name: Build and push patched image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.JFROG_URL }}/base-image-remediation-demo/petclinic:patched-${{ steps.vars.outputs.sha_short }}
            ${{ secrets.JFROG_URL }}/base-image-remediation-demo/petclinic:patched-latest
